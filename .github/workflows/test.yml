name: Test custom action

on:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  paper:
    name: Paper end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Run action
        id: minecraft
        uses: YueMi-Development/Minecraft-Server-Action@v1
        with:
          server-type: PAPER
          minecraft-version: '1.21.4'
          run-timeout: 180s
          server-dir: server
          files: |
            .github/test-fixtures/server.properties

      - name: Verify preparation
        run: |
          set -euo pipefail
          test -s server/server.jar
          grep -qx 'eula=true' server/eula.txt
          test -s server/server.log
          grep -q 'Done (' server/server.log

          # The server rewrites server.properties on startup and fills in the
          # defaults it is missing, so check that our own values survived
          # rather than comparing the file byte for byte.
          for expected in \
            'motd=ActionTestServer' \
            'level-name=action-test-world' \
            'max-players=7' \
            'difficulty=peaceful' \
            'online-mode=false'
          do
            if ! grep -qxF "$expected" server/server.properties; then
              echo "::error::Expected '$expected' in server/server.properties"
              exit 1
            fi
          done

          echo "Build id: $BUILD_ID"
          echo "Build UUID: $BUILD_UUID"
          echo "Java: $JAVA_VERSION"
        env:
          BUILD_ID: ${{ steps.minecraft.outputs.build-id }}
          BUILD_UUID: ${{ steps.minecraft.outputs.build-uuid }}
          JAVA_VERSION: ${{ steps.minecraft.outputs.java-version }}
          MC_VERSION: ${{ steps.minecraft.outputs.mc-version }}

      - name: Upload test server artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-paper-server-${{ github.run_id }}
          path: server/
          if-no-files-found: warn
          retention-days: 1
